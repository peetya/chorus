name: Bug
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What did you do? Please don't paste tokens or private post drafts.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
